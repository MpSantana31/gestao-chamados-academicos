<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastrar usuário')}"></head>
<body class="app sem-aside">

<header th:replace="~{fragments/layout :: topbar('usuarios', ${admin}, ${usuario})}"></header>

<main>
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <nav class="caminho" aria-label="localização">admin / usuários / novo</nav>
    <h1>Cadastrar usuário</h1>

    <section>
        <h2>Dados da conta</h2>
        <form class="formulario" th:action="@{/usuarios/salvar}" th:object="${usuarioCadastroDTO}" method="post">
            <div class="form-grid">
                <label>Login
                    <input type="text" th:field="*{login}" required>
                </label>
                <label>Nome
                    <input type="text" th:field="*{nome}" required>
                </label>
                <label>Senha
                    <input type="text" th:field="*{senha}" required>
                </label>
                <label>Papel
                    <select th:field="*{papel}" required>
                        <option value="USUARIO">USUARIO</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </label>
            </div>
            <div class="acoes-form">
                <button type="submit">Salvar usuário</button>
                <a class="btn-ghost" th:href="@{/usuarios}">Voltar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
