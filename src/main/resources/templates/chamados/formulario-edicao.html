<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar chamado</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h1>Editar chamado</h1>

<p>
    <a href="/chamados">Voltar para a lista</a>
</p>

<p class="mensagem-erro" th:if="${mensagemErro}" th:text="${mensagemErro}"></p>

<form th:action="@{/chamados/atualizar}" th:object="${chamado}" method="post">

    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{dataAbertura}">

    <p>
        <label>Título:</label><br>
        <input type="text" th:field="*{titulo}" required>
    </p>

    <p>
        <label>Descrição:</label><br>
        <textarea th:field="*{descricao}" rows="5" required></textarea>
    </p>

    <p>
        <label>Categoria:</label><br>
        <select th:field="*{categoria}" required>
            <option value="Suporte técnico">Suporte técnico</option>
            <option value="Documentos">Documentos</option>
            <option value="Matrícula">Matrícula</option>
            <option value="Atendimento acadêmico">Atendimento acadêmico</option>
        </select>
    </p>

    <p>
        <label>Status:</label><br>
        <select th:field="*{status}" required>
            <option value="ABERTO">ABERTO</option>
            <option value="EM_ANALISE">EM_ANALISE</option>
            <option value="CONCLUIDO">CONCLUIDO</option>
            <option value="CANCELADO">CANCELADO</option>
        </select>
    </p>

    <p>
        <label>Prioridade:</label><br>
        <select th:field="*{prioridade}" required>
            <option value="BAIXA">BAIXA</option>
            <option value="MEDIA">MEDIA</option>
            <option value="ALTA">ALTA</option>
            <option value="URGENTE">URGENTE</option>
        </select>
    </p>

    <p>
        <label>Responsável:</label><br>
        <input type="text" th:field="*{responsavel}" required>
    </p>

    <p>
        <label>Observação de atendimento:</label><br>
        <textarea th:field="*{observacaoAtendimento}" rows="4"></textarea>
    </p>

    <button type="submit">Atualizar</button>

</form>

</body>
</html>
