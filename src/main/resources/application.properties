spring.application.name=sistema-gestao-chamados-academicos
server.port=8080
spring.datasource.url=jdbc:h2:file:./dados/chamados;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
# Credenciais de DEMONSTRACAO. Substituir por autenticacao persistida/criptografada em ambiente real.
app.demo.usuario=${DEMO_USUARIO:admin}
app.demo.senha=${DEMO_SENHA:admin123}
